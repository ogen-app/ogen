services:
    api:
        image: alephbetai/ogen:latest
        platform: linux/amd64
        # All configuration (incl. secrets) lives in .env, which is gitignored.
        # Copy .env.example -> .env and fill it in before `docker compose up`.
        env_file:
            - .env
        environment:
            # CON-86 usage analytics. Default the API at the bundled TimescaleDB
            # service so the stack meters out of the box. Override (or set empty
            # to disable usage analytics entirely) via ANALYTICS_DSN in .env.
            ANALYTICS_DSN: "${ANALYTICS_DSN:-postgres://ogen:ogen@timescaledb:5432/ogen_analytics?sslmode=disable}"
            # Internal operator gRPC surface consumed by Harbor (secrets mgmt).
            # Bind ALL interfaces (":9091") — not the code default 127.0.0.1 —
            # so the harbor container reaches it at api:9091 over the compose
            # network; the host-published port below stays loopback-only. The
            # server starts only with a non-empty token, so default a dev token
            # here to link Harbor out of the box. Set GRPC_AUTH_TOKEN in .env to
            # override (Harbor reuses the SAME variable, so they always match).
            GRPC_ADDR: ":9091"
            GRPC_AUTH_TOKEN: "${GRPC_AUTH_TOKEN:-ogen-harbor-dev}"
        volumes:
            - ./ogen-keys:/var/lib/ogen/keys
        ports:
            - "9001:9001"
            # Internal operator gRPC surface (secrets management for Harbor).
            # Published on the HOST LOOPBACK ONLY so it is never reachable from
            # the LAN — a host-run Harbor reaches it at localhost:9091. Gated by
            # GRPC_AUTH_TOKEN (server only starts when the token is set). NEVER
            # publish this on a non-loopback interface in prod; reach it over the
            # private network / a NetworkPolicy instead.
            - "127.0.0.1:9091:9091"
        depends_on:
            postgres:
                condition: service_healthy
            timescaledb:
                condition: service_healthy

    postgres:
        # pgvector image = stock Postgres 17 + the `vector` extension prebuilt
        # (CON-87 WS4). Multi-arch, so it runs native on arm64/amd64 hosts.
        image: pgvector/pgvector:pg17
        environment:
            POSTGRES_USER: "${POSTGRES_USER:-ogen}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ogen}"
            POSTGRES_DB: "${POSTGRES_DB:-ogen}"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-ogen} -d ${POSTGRES_DB:-ogen}",
                ]
            interval: 2s
            timeout: 2s
            retries: 30

    # Isolated analytics database (CON-86): TimescaleDB on PG17 for vendor_usage_events
    # — the hypertable + continuous-aggregate rollups + compression/retention.
    # Kept SEPARATE from the control-plane postgres above so the extension
    # dependency stays quarantined and the control plane stays vanilla. The API
    # points here via ANALYTICS_DSN (see the api service) and runs the analytics
    # migrations at boot; the same migrations also run on plain Postgres (the
    # TimescaleDB-specific DDL is guarded), so this image is what enables the
    # hypertable path. Host port 5433 avoids clashing with postgres on 5432.
    timescaledb:
        image: timescale/timescaledb:latest-pg17
        environment:
            POSTGRES_USER: "${POSTGRES_USER:-ogen}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ogen}"
            POSTGRES_DB: "ogen_analytics"
        volumes:
            - timescale-data:/var/lib/postgresql/data
        ports:
            - "5433:5432"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-ogen} -d ogen_analytics",
                ]
            interval: 2s
            timeout: 2s
            retries: 30

    # River job-queue dashboard (CON-87 WS3). Standalone UI image that reads
    # River's tables — it runs no migrations of its own, so it needs them to
    # already exist. The API creates them via jobs.MigrateRiver at boot;
    # riverui therefore depends on the API and restarts until the schema is
    # present. UI at http://localhost:9004.
    riverui:
        image: ghcr.io/riverqueue/riverui:latest
        environment:
            DATABASE_URL: "${DATABASE_DSN:-postgres://ogen:ogen@postgres:5432/ogen?sslmode=disable}"
        ports:
            - "9004:8080"
        depends_on:
            postgres:
                condition: service_healthy
            api:
                condition: service_started
        restart: unless-stopped

    # Frontend dev server (CON-98). The SPA lives in its own repo (ogen-app/ui);
    # this mounts a sibling checkout and runs Vite with hot-reload, proxying
    # /api to the api service (see that repo's vite.config.ts — the browser stays
    # same-origin, so no CORS is needed in dev). Opt-in via a profile so the
    # default `docker compose up` stays backend-only:
    #   docker compose --profile ui up
    # Override UI_PATH if your ui checkout isn't at ../ui.
    ui:
        image: node:24-alpine
        profiles: ["ui"]
        working_dir: /app
        environment:
            # Let corepack fetch the pnpm version pinned in package.json non-interactively.
            COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
            # Vite proxies /api here (the api service on the compose network).
            API_URL: "http://api:9001"
            # Native FS events don't cross the bind mount on macOS/Windows — poll instead.
            CHOKIDAR_USEPOLLING: "true"
        volumes:
            # Local UI source -> live hot-reload. node_modules stays in an anonymous
            # volume so the host's (wrong-arch) modules don't shadow the container's.
            - "${UI_PATH:-../ui}:/app"
            - /app/node_modules
        ports:
            - "9002:9002" # Vite dev server (port set in ui/vite.config.ts)
        # `pnpm exec vite` invokes the Vite binary directly so `--host 0.0.0.0`
        # reaches it (a plain `pnpm dev -- --host` forwards the `--` literally and
        # Vite stays bound to the container's localhost, unreachable from the host).
        command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm exec vite --host 0.0.0.0"
        depends_on:
            api:
                condition: service_started

    # PDF parsing microservice (CON-103). Parses content-bank PDFs (text + page-
    # aware chunks + thumbnail) and renders attachment thumbnails / page counts.
    # Built and published from the separate ogen-app/pdf-service repo (CGO +
    # libpdfium). The API reaches it over the private network ONLY — no host
    # `ports:` — at pdf-service:50051 (PDF_SERVICE_ADDR in .env).
    #
    # Gated behind the `pdf` profile until that image is published, so the default
    # `docker compose up` keeps working (the API degrades gracefully: PDF features
    # off). Once the image exists, drop the profile to enable PDF by default:
    #   docker compose --profile pdf up
    pdf-service:
        image: alephbetai/pdf-service:latest
        platform: linux/amd64
        expose:
            - "50051"

    # Video probing microservice (CON-148), mirrors pdf-service. Probes uploaded
    # video for duration/codec/resolution and captures a poster frame via
    # ffmpeg/ffprobe. Built and published from the separate ogen-app/video-service
    # repo. The API reaches it over the private network ONLY — no host `ports:` —
    # at video-service:50051 (VIDEO_SERVICE_ADDR in .env).
    #
    # Gated behind the `video` profile until that image is published, so the
    # default `docker compose up` keeps working (the API degrades gracefully:
    # video uploads accepted but unprobed). Once the image exists, enable with:
    #   docker compose --profile video up
    video-service:
        image: alephbetai/video-service:latest
        platform: linux/amd64
        profiles: ["video"]
        expose:
            - "50051"

    # Document parsing microservice (CON-280), mirrors pdf-service. Parses
    # content-bank office/text documents (.docx/.pptx/.xlsx/.odt/... ) into
    # embedding-ready, source-anchored chunks. Built and published from the
    # separate ogen-app/document-service repo (pure Go, no CGO). The API reaches
    # it over the private network ONLY — no host `ports:` — at
    # document-service:50051 (DOCUMENTS_SERVICE_ADDR in .env).
    #
    # Gated behind the `documents` profile until that image is published, so the
    # default `docker compose up` keeps working (document uploads fail fast with a
    # clear message while disabled). Once the image exists, set
    # DOCUMENTS_SERVICE_ADDR=document-service:50051 in .env and enable with:
    #   docker compose --profile documents up
    document-service:
        image: alephbetai/document-service:latest
        platform: linux/amd64
        profiles: ["documents"]
        expose:
            - "50051"

    # Harbor (../harbor) — Ogen's operations dashboard. Brought up ALONGSIDE
    # this stack so the two link over gRPC:
    #   docker compose --profile harbor up
    # Opt-in via the `harbor` profile (like ui/pdf/video) so the default
    # `docker compose up` stays Ogen-only and needs no harbor checkout. Harbor
    # shares THIS stack's postgres — a SEPARATE `harbor` database it creates on
    # first boot (EnsureDatabase, connecting as the ogen superuser) — and reads
    # Ogen's control-plane + analytics DBs. Its Settings → Secrets tab reaches
    # Ogen's internal gRPC surface at api:9091 (token below). UI on :9003.
    #
    # This is the prod-like build (harbor's multi-stage Dockerfile embeds the
    # Next.js UI); docker-compose.override.yml swaps in a live-reload air image
    # for dev. Point HARBOR_PATH at your checkout if it isn't the sibling ../harbor.
    harbor:
        build:
            context: ${HARBOR_PATH:-../harbor}
        image: harbor:latest
        profiles: ["harbor"]
        # Pick up Harbor's OWN .env (Google OAuth creds, AUTH_ALLOWED_EMAILS, log
        # level, cookie name, …) from its checkout. Optional so a checkout without
        # a .env still boots. The `environment:` block below is applied AFTER this
        # and therefore WINS — that's deliberate: it pins the DB/analytics/gRPC
        # endpoints to the compose service names, overriding the host `localhost`
        # forms a dev .env carries (which would be wrong inside this network).
        env_file:
            - path: ${HARBOR_PATH:-../harbor}/.env
              required: false
        environment:
            ADDR: ":9002"
            # Same postgres container as Ogen, DIFFERENT database. Connects as the
            # ogen superuser so Harbor's EnsureDatabase can CREATE the harbor DB on
            # first boot (a fresh volume); thereafter it's a no-op.
            DATABASE_DSN: "postgres://${POSTGRES_USER:-ogen}:${POSTGRES_PASSWORD:-ogen}@postgres:5432/harbor?sslmode=disable"
            # Ogen's control-plane + analytics DBs (Harbor reads; never migrates).
            OGEN_DATABASE_DSN: "postgres://${POSTGRES_USER:-ogen}:${POSTGRES_PASSWORD:-ogen}@postgres:5432/${POSTGRES_DB:-ogen}?sslmode=disable"
            ANALYTICS_DSN: "${ANALYTICS_DSN:-postgres://ogen:ogen@timescaledb:5432/ogen_analytics?sslmode=disable}"
            # Ogen internal operator gRPC surface. Reuses the SAME token variable
            # as the api service's GRPC_AUTH_TOKEN so they always match; the dev
            # default links the two out of the box.
            OGEN_GRPC_ADDR: "api:9091"
            OGEN_GRPC_TOKEN: "${GRPC_AUTH_TOKEN:-ogen-harbor-dev}"
            DEBUG: "true"
        ports:
            # Host 9003 -> container 9002 (Ogen's ui profile already uses 9002).
            - "9003:9002"
        depends_on:
            postgres:
                condition: service_healthy
            timescaledb:
                condition: service_healthy
            api:
                condition: service_started

    # Harbor UI dev server (Next.js) — hot-reloads the harbor UI in the browser,
    # mirroring Ogen's `ui` service. In the same `harbor` profile, so
    # `docker compose --profile harbor up` brings up BOTH the harbor backend
    # (Go live-reload, :9003) and this UI dev server. `next dev` proxies /api to
    # the harbor backend (HARBOR_API_URL), so the browser stays same-origin —
    # open http://localhost:9005. node:22-alpine matches harbor's own Dockerfile
    # (npm ci on musl). Override HARBOR_PATH if your checkout isn't ../harbor.
    harbor-ui:
        image: node:22-alpine
        profiles: ["harbor"]
        working_dir: /app
        environment:
            # next dev proxies /api here (the harbor backend on the compose network).
            HARBOR_API_URL: "http://harbor:9002"
            # Native FS events don't cross the bind mount on macOS/Windows, so the
            # dev-server watcher must poll to notice host edits.
            WATCHPACK_POLLING: "true"
            CHOKIDAR_USEPOLLING: "true"
        volumes:
            # Local UI source -> live HMR. node_modules + .next stay in anonymous
            # volumes so the host's copies don't shadow the container's and .next
            # writes don't cross the (slow) bind mount.
            - "${HARBOR_PATH:-../harbor}/ui:/app"
            - /app/node_modules
            - /app/.next
        ports:
            - "9005:3000" # Next dev server (container 3000 -> host 9005)
        # `npm ci` mirrors harbor's Dockerfile; `next dev --hostname 0.0.0.0` binds
        # all interfaces so the host reaches it through the published port.
        command: sh -c "npm ci && npx next dev --hostname 0.0.0.0 --port 3000"
        depends_on:
            harbor:
                condition: service_started

volumes:
    postgres-data:
    timescale-data:
    ogen-keys:
