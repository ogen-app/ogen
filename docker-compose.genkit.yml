# Mirror of docker-compose.yml, but the api is built locally from
# Dockerfile.genkit (Genkit Dev UI baked in) instead of the prebuilt
# image, and exposes the extra Dev UI port. Run with `make docker-genkit`.
# Keep the postgres, river-schema, river-service and riverui services in sync
# with docker-compose.yml.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.genkit
    platform: linux/amd64
    # All configuration (incl. secrets) lives in .env, which is gitignored.
    # Copy .env.example -> .env and fill it in before `docker compose up`.
    env_file:
      - .env
    environment:
      # Background jobs run in river-service (service below): ogen relays its
      # job outbox to it and serves the jobs' steps on the job RPC listener.
      RIVER_SERVICE_ADDR: "${RIVER_SERVICE_ADDR-river-service:9092}"
      RIVER_SERVICE_AUTH_TOKEN: "${RIVER_SERVICE_AUTH_TOKEN:-ogen-river-service-dev}"
      JOB_RPC_ADDR: ":9093"
      RIVER_RPC_AUTH_TOKEN: "${RIVER_RPC_AUTH_TOKEN:-ogen-river-rpc-dev}"
      JOBS_DISABLED: "${JOBS_DISABLED:-false}"
    volumes:
      - ./ogen-keys:/var/lib/ogen/keys
    ports:
      - "9001:9001"
      - "4000:4000"   # Genkit Dev UI
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # pgvector image = stock Postgres 17 + the `vector` extension prebuilt
    # (CON-87 WS4). Multi-arch, so it runs native on arm64/amd64 hosts.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ogen}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ogen}"
      POSTGRES_DB: "${POSTGRES_DB:-ogen}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ogen} -d ${POSTGRES_DB:-ogen}"]
      interval: 2s
      timeout: 2s
      retries: 30

  # river_service schema for river-service's River tables (see
  # docker-compose.yml).
  river-schema:
    image: pgvector/pgvector:pg17
    command:
      [
        "psql",
        "${DATABASE_DSN:-postgres://ogen:ogen@postgres:5432/ogen?sslmode=disable}",
        "-c",
        "CREATE SCHEMA IF NOT EXISTS river_service",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # river-service runs every background job; built from a sibling checkout
  # (RIVER_SERVICE_PATH, default ../river-service). No sidecars run in this
  # stack, so ingestion jobs that need one report it as unconfigured.
  river-service:
    build:
      context: ${RIVER_SERVICE_PATH:-../river-service}
    environment:
      DATABASE_DSN: "${DATABASE_DSN:-postgres://ogen:ogen@postgres:5432/ogen?sslmode=disable}"
      RIVER_SCHEMA: river_service
      RIVER_QUEUES: default,analysis,audio,image,ingest
      GRPC_ADDR: ":9092"
      GRPC_AUTH_TOKEN: "${RIVER_SERVICE_AUTH_TOKEN:-ogen-river-service-dev}"
      OGEN_GRPC_ADDR: "dns:///api:9093"
      OGEN_RPC_AUTH_TOKEN: "${RIVER_RPC_AUTH_TOKEN:-ogen-river-rpc-dev}"
      LOG_FORMAT: text
    depends_on:
      river-schema:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped

  # River job-queue dashboard over river-service's schema. UI at
  # http://localhost:9004.
  riverui:
    image: ghcr.io/riverqueue/riverui:latest
    environment:
      DATABASE_URL: "${DATABASE_DSN:-postgres://ogen:ogen@postgres:5432/ogen?sslmode=disable}&search_path=river_service"
    ports:
      - "9004:8080"
    depends_on:
      river-service:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  ogen-keys:
