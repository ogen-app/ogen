name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    environment: testing
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage
        run: make test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14

  test-integration:
    name: Integration Test
    needs: test
    runs-on: ubuntu-latest
    environment: testing
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        run: make test-integration

  semgrep:
    name: Semgrep security scan
    needs: test-integration
    runs-on: ubuntu-latest
    environment: testing
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  build-and-push:
    name: Build and push Docker image
    needs: test-integration
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: testing
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ogen
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-openapi:
    name: Publish OpenAPI spec
    needs: test-integration
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: testing
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate OpenAPI spec
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          swag init -g cmd/server/main.go -o docs --outputTypes go,json

      - name: Clone api repo
        env:
          GH_TOKEN: ${{ secrets.OPENAPI_DEPLOY_TOKEN }}
        run: git clone "https://x-access-token:${GH_TOKEN}@github.com/ogen-app/api.git" _api_repo

      - name: Copy swagger.json
        run: cp docs/swagger.json _api_repo/swagger.json

      - name: Commit and push
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          cd _api_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add swagger.json
          if git diff --cached --quiet; then
            echo "swagger.json unchanged, skipping commit"
          else
            git commit -m "chore: update OpenAPI spec (ogen-app/ogen@${SHORT_SHA:0:7})"
            git push
          fi
