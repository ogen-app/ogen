name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Go jobs restore one shared cache (modules + build cache) and only Test saves
# it, once per main run. setup-go's built-in cache can't do this: it saves once
# per key and never again on an exact hit, so whichever job finished first froze
# a near-empty cache for every later run.
jobs:
  test:
    name: Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: testing
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-

      - name: Run tests with coverage
        run: make test

      # main pushes only: PRs read main's cache, and saving from every PR would
      # crowd the repo cache.
      - name: Save Go cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 1

  lint:
    name: Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14

  test-integration:
    name: Integration Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: testing
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-

      - name: Run integration tests
        run: make test-integration

  semgrep:
    name: Semgrep security scan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: testing
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # Builds the image on PRs without pushing, so a broken Dockerfile or GeoIP
  # download fails before merge instead of on Railway.
  docker-build:
    name: Docker build
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Blacksmith keeps the layer cache on a sticky disk keyed by cache-key.
      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@9657a6e02ca6445e6d6ce5ffaf370f4828dea50d # v2.4.0
        with:
          cache-key: Dockerfile

      - name: Build
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          push: false

  # Every green main push publishes ghcr.io/ogen-app/ogen:<build>, where build
  # is the commit count on main, then asks ogen-release to bump the api to it.
  build-and-push:
    name: Build and push Docker image
    needs: [test, lint, test-integration]
    if: github.event_name == 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: testing
    # Back-to-back merges publish one at a time, so build numbers reach the
    # registry and ogen-release in order. queue: max keeps every waiting run;
    # by default a newer one would cancel the run already waiting.
    concurrency:
      group: build-and-push
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write

    steps:
      # Full history: the build number is the commit count, which a shallow
      # clone reports as 1.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build number
        id: build
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@9657a6e02ca6445e6d6ce5ffaf370f4828dea50d # v2.4.0
        with:
          cache-key: Dockerfile

      # The source label links the package to this repo, which is what lets
      # GITHUB_TOKEN push to it.
      - name: Build and push
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          push: true
          tags: ghcr.io/ogen-app/ogen:${{ steps.build.outputs.number }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/ogen-app/ogen

      # Best effort: a missing ogen-release repo or token must not fail main.
      - name: Dispatch bump to ogen-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          BUILD: ${{ steps.build.outputs.number }}
        run: |
          gh api repos/ogen-app/ogen-release/dispatches \
            -f event_type=bump \
            -f 'client_payload[service]=api' \
            -F "client_payload[build]=$BUILD" \
            -f "client_payload[revision]=$GITHUB_SHA"

  publish-openapi:
    name: Publish OpenAPI spec
    if: github.event_name == 'push'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: testing
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-

      - name: Generate OpenAPI spec
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          swag init -g cmd/server/main.go -o docs --outputTypes go,json

      - name: Clone api repo
        env:
          GH_TOKEN: ${{ secrets.OPENAPI_DEPLOY_TOKEN }}
        run: git clone "https://x-access-token:${GH_TOKEN}@github.com/ogen-app/api.git" _api_repo

      - name: Copy swagger.json
        run: cp docs/swagger.json _api_repo/swagger.json

      - name: Commit and push
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          cd _api_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add swagger.json
          if git diff --cached --quiet; then
            echo "swagger.json unchanged, skipping commit"
          else
            git commit -m "chore: update OpenAPI spec (ogen-app/ogen@${SHORT_SHA:0:7})"
            git push
          fi
