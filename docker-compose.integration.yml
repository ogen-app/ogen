services:
  # Postgres (pgvector image) backing the integration suite (CON-87 WS5).
  # The suite connects to localhost:5432 and isolates per ginkgo worker.
  postgres:
    image: pgvector/pgvector:pg17
    # Each integration Describe provisions its own database, so raise the
    # connection ceiling above the default 100.
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: ogen
      POSTGRES_PASSWORD: ogen
      POSTGRES_DB: ogen
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogen -d ogen"]
      interval: 2s
      timeout: 2s
      retries: 30

  # MinIO is the S3-compatible backend used by post-attachment integration
  # tests (CON-73). The bucket itself is created on demand by the test
  # helper — keeping that out of the compose file means each test run
  # starts from a clean state without docker volume juggling.
  #
  # Pulled from quay.io (MinIO's official registry) and pinned to a release:
  # the minio/minio image was removed from Docker Hub in Sept 2026, so
  # `minio/minio:latest` now fails to pull with "repository does not exist".
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    ports:
      - "9100:9000"
    environment:
      MINIO_ROOT_USER: integration
      MINIO_ROOT_PASSWORD: integration-secret
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
